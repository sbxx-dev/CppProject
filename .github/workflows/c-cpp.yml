name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Устанавливаем компилятор и базовые инструменты сборки
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # 2. Теперь g++ доступен, можно компилировать
      - name: Compile C++ Project
        run: |
          g++ -std=c++17 -Iinclude cpp/*.cpp -o library
